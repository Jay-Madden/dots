name: Build and Push Shell Image

on:
  workflow_dispatch:

enable-openid-connect: true

jobs:
  build-and-push:
    runs-on: codeberg-small
    env:
      IMAGE_REPOSITORY: codeberg.org/jay-madden/dots/shell

    steps:
    - name: Get OIDC token
      id: oidc
      env:
        AUDIENCE: u:834738:09e0c27d-213f-4801-804e-306eb49982c6
      run: |
        set -euo pipefail
        response="$(curl --fail --silent --show-error \
          --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE")"
        token="$(printf '%s' "$response" | jq --exit-status --raw-output '.value')"
        echo "::add-mask::$token"
        echo "token=$token" >> "$FORGEJO_OUTPUT"

    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        token: ${{ steps.oidc.outputs.token }}
        submodules: recursive
        persist-credentials: false

    - name: Set up QEMU
      uses: https://github.com/docker/setup-qemu-action@v3
      with:
        platforms: arm64,amd64

    - name: Set up Buildx
      uses: https://github.com/docker/setup-buildx-action@v3

    - name: Log in to registry
      env:
        REGISTRY_USERNAME: ${{ forgejo.actor }}
        REGISTRY_PASSWORD: ${{ steps.oidc.outputs.token }}
      run: |
        set -euo pipefail
        printf '%s' "$REGISTRY_PASSWORD" | docker login codeberg.org \
          --username "$REGISTRY_USERNAME" --password-stdin

    - name: Build and push image
      env:
        SHA: ${{ forgejo.sha }}
        REF: ${{ forgejo.ref }}
      run: |
        set -euo pipefail
        set -- --tag "$IMAGE_REPOSITORY:$SHA"
        if [ "$REF" = "refs/heads/master" ]; then
          set -- "$@" --tag "$IMAGE_REPOSITORY:latest"
        fi
        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          "$@" \
          --cache-from "type=registry,ref=$IMAGE_REPOSITORY:buildcache" \
          --cache-to "type=registry,ref=$IMAGE_REPOSITORY:buildcache,mode=max" \
          --push \
          .
