name: Update Submodules

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

enable-openid-connect: true

jobs:
  update-submodules:
    runs-on: codeberg-tiny-lazy
    permissions:
      contents: write

    steps:
    - name: Get OIDC token
      id: oidc
      env:
        AUDIENCE: u:834738:09e0c27d-213f-4801-804e-306eb49982c6
      run: |
        set -euo pipefail
        response="$(curl --fail --silent --show-error \
          --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE")"
        token="$(printf '%s' "$response" | jq --exit-status --raw-output '.value')"
        echo "::add-mask::$token"
        echo "token=$token" >> "$FORGEJO_OUTPUT"

    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        token: ${{ steps.oidc.outputs.token }}
        submodules: true
        fetch-depth: 0

    - name: Configure Git
      run: |
        git config --global user.name "Jay Madden"
        git config --global user.email "jaymaddencox@gmail.com"

    - name: Update submodules to latest commits
      run: |
        git submodule update --remote --merge

        if git diff --quiet; then
          echo "No submodule updates available"
          exit 0
        fi

    - name: Commit and push changes
      run: |
        git add .

        if git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
        fi

        git commit -m "chore: update submodules to latest commits [skip ci]"

        git push origin master
