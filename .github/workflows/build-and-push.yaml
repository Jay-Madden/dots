name: Build and Push Shell Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPOSITORY: ghcr.io/jay-madden/dots/shell
  REGISTRY_USERNAME: ${{ github.actor }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          runner: ubuntu-26.04
        - arch: arm64
          runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
    - name: Use HTTPS for Codeberg submodules
      run: git config --global url."https://codeberg.org/".insteadOf "git@codeberg.org:"

    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive
        persist-credentials: false

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to registry
      env:
        REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        printf '%s' "$REGISTRY_PASSWORD" | docker login ghcr.io \
          --username "$REGISTRY_USERNAME" --password-stdin

    - name: Build and push native image
      env:
        ARCH: ${{ matrix.arch }}
      run: |
        set -euo pipefail
        docker buildx build \
          --platform "linux/$ARCH" \
          --tag "$IMAGE_REPOSITORY:$GITHUB_SHA-$ARCH" \
          --cache-from "type=registry,ref=$IMAGE_REPOSITORY:buildcache-$ARCH" \
          --cache-to "type=registry,ref=$IMAGE_REPOSITORY:buildcache-$ARCH,mode=max" \
          --push \
          .

  publish:
    needs: build
    runs-on: ubuntu-26.04

    steps:
    - name: Set up Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to registry
      env:
        REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        printf '%s' "$REGISTRY_PASSWORD" | docker login ghcr.io \
          --username "$REGISTRY_USERNAME" --password-stdin

    - name: Publish multiarch manifest
      run: |
        set -euo pipefail
        set -- --tag "$IMAGE_REPOSITORY:$GITHUB_SHA"
        if [ "$GITHUB_REF" = "refs/heads/master" ]; then
          set -- "$@" --tag "$IMAGE_REPOSITORY:latest"
        fi
        docker buildx imagetools create \
          "$@" \
          "$IMAGE_REPOSITORY:$GITHUB_SHA-amd64" \
          "$IMAGE_REPOSITORY:$GITHUB_SHA-arm64"
